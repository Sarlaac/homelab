- name: Install Uptime Kuma in Docker
  community.docker.docker_container:
    name: uptime-kuma
    image: louislam/uptime-kuma:1
    state: started
    pull: true
    restart_policy: always
    ports:
      - "3000:3000"
    volumes:
      - '/home/docker/uptime-kuma/data:/app/data'
      - '/var/run/docker.sock:/var/run/docker.sock'
    networks:
      - name: reverse_proxy
